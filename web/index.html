<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>fuzzykit explorer</title>
    <meta
      name="description"
      content="An interactive explorer for fuzzykit: type to fuzzy-search a catalogue of languages, frameworks and tools, and watch the ranking, scores and matched characters update live."
    />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%94%8D%3C/text%3E%3C/svg%3E" />
  </head>
  <body>
    <div id="app">
      <header class="masthead">
        <div class="brand">
          <span class="logo" aria-hidden="true">fk</span>
          <div>
            <h1>fuzzykit <span class="dim">explorer</span></h1>
            <p class="tagline">Type anything. Watch fuzzy ranking happen live.</p>
          </div>
        </div>
        <a class="repo-link" href="https://github.com/BoogeyCodes/fuzzykit" target="_blank" rel="noreferrer noopener">View on GitHub</a>
      </header>

      <section class="search-panel">
        <div class="search-field">
          <span class="search-icon" aria-hidden="true">🔍</span>
          <input
            id="query"
            type="text"
            placeholder="Try a typo, e.g. tpescript or postgress"
            autocomplete="off"
            autocapitalize="off"
            spellcheck="false"
            aria-label="Search query"
          />
          <button id="clear" class="clear-btn" type="button" aria-label="Clear query" hidden>&times;</button>
        </div>

        <div class="controls">
          <label class="control">
            <span class="control-label">Algorithm</span>
            <select id="algorithm">
              <option value="jaro-winkler">Jaro–Winkler</option>
              <option value="dice">Sørensen–Dice</option>
              <option value="levenshtein">Levenshtein</option>
            </select>
          </label>

          <label class="control">
            <span class="control-label">Threshold <output id="threshold-value">0.30</output></span>
            <input id="threshold" type="range" min="0" max="1" step="0.01" value="0.3" />
          </label>

          <label class="control">
            <span class="control-label">Limit <output id="limit-value">25</output></span>
            <input id="limit" type="range" min="1" max="50" step="1" value="25" />
          </label>

          <label class="control control-toggle">
            <input id="case-insensitive" type="checkbox" checked />
            <span class="control-label">Case-insensitive</span>
          </label>
        </div>
      </section>

      <section class="results-panel">
        <div class="results-meta">
          <span id="results-count">—</span>
          <span class="dim" id="results-note"></span>
        </div>
        <ol id="results" class="results" aria-live="polite"></ol>
        <p id="empty-state" class="empty-state" hidden>No matches cleared the threshold. Lower it, or try a different algorithm.</p>
      </section>

      <footer class="footer">
        <span>Ranked by the zero-dependency <strong>fuzzykit</strong> library. Matched characters are underlined with a greedy subsequence highlighter.</span>
      </footer>
    </div>

    <script type="module" src="/main.ts"></script>
  </body>
</html>
